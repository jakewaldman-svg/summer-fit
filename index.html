<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Summer Fit">
<title>Summer Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --green: #3B6D11;
  --green-light: #EAF3DE;
  --green-mid: #639922;
  --green-dark: #27500A;
  --blue: #185FA5;
  --blue-light: #E6F1FB;
  --blue-mid: #378ADD;
  --pink: #993556;
  --pink-light: #FBEAF0;
  --amber: #854F0B;
  --amber-light: #FAEEDA;
  --gray: #5F5E5A;
  --gray-light: #F1EFE8;
  --gray-mid: #D3D1C7;
  --text: #1a1917;
  --text-secondary: #5F5E5A;
  --text-hint: #888780;
  --bg: #FAFAF8;
  --bg-card: #FFFFFF;
  --border: rgba(0,0,0,0.1);
  --border-strong: rgba(0,0,0,0.18);
  --radius: 12px;
  --radius-sm: 8px;
  --serif: 'DM Serif Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

.shell { max-width: 430px; margin: 0 auto; }

.header {
  padding: 20px 20px 0;
  margin-bottom: 4px;
}
.header-row { display: flex; align-items: baseline; justify-content: space-between; }
.app-title { font-family: var(--serif); font-size: 26px; color: var(--text); }
.app-date { font-size: 12px; color: var(--text-hint); }

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  background: rgba(250,250,248,0.96);
  backdrop-filter: blur(10px);
  border-top: 0.5px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 8px);
  z-index: 100;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 4px 6px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-hint);
  font-family: var(--sans);
  font-size: 10px;
  gap: 3px;
  transition: color 0.15s;
}
.nav-item.active { color: var(--green); }
.nav-icon { font-size: 22px; }

.content { padding: 16px 20px 90px; }

.section-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--text-hint);
  text-transform: uppercase;
  margin-bottom: 10px;
  margin-top: 20px;
}
.section-label:first-child { margin-top: 0; }

/* Day tabs */
.day-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.day-tab {
  flex: 1;
  padding: 10px 6px;
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: var(--sans);
}
.day-tab .tab-letter { font-family: var(--serif); font-size: 17px; display: block; line-height: 1; }
.day-tab .tab-sub { font-size: 9px; color: var(--text-hint); display: block; margin-top: 2px; line-height: 1.3; }
.day-tab.active { background: var(--text); border-color: var(--text); }
.day-tab.active .tab-letter { color: #fff; }
.day-tab.active .tab-sub { color: rgba(255,255,255,0.6); }
.day-tab .up-next-pip {
  display: inline-block;
  margin-top: 4px;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.05em;
  color: var(--green);
  background: var(--green-light);
  border-radius: 20px;
  padding: 1px 7px;
}
.day-tab.active .up-next-pip { background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.85); }

/* Warm-up block */
.warmup-card {
  background: var(--amber-light);
  border: 0.5px solid rgba(133,79,11,0.15);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.warmup-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--amber);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.warmup-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 0.5px solid rgba(133,79,11,0.1);
  font-size: 13px;
}
.warmup-item:last-child { border-bottom: none; padding-bottom: 0; }
.warmup-dur { font-size: 12px; color: var(--amber); font-weight: 500; }

/* Round indicator */
.round-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  padding: 8px 12px;
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-secondary);
}
.round-pips { display: flex; gap: 5px; margin-left: auto; }
.round-pip {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-hint);
  cursor: pointer;
  transition: all 0.15s;
}
.round-pip.done { background: var(--green); border-color: var(--green); color: #fff; }

/* Exercise card */
.ex-card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.ex-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
.ex-name { font-weight: 500; font-size: 15px; line-height: 1.3; flex: 1; }
.ex-video {
  font-size: 11px;
  color: var(--blue);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  background: var(--blue-light);
  border-radius: 20px;
  margin-left: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}
.ex-target { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.ex-desc { font-size: 12px; color: var(--text-hint); line-height: 1.5; margin-bottom: 12px; }

.sets-cols { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-hint); margin-bottom: 6px; padding: 0 2px; }
.set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.set-num { font-size: 12px; color: var(--text-hint); width: 40px; flex-shrink: 0; }
.set-reps { font-size: 13px; color: var(--text-secondary); flex: 1; }
.set-check {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: var(--bg);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.set-check.done { background: var(--green); border-color: var(--green); color: #fff; }

/* Progression badges */
.prog-badge {
  margin-top: 10px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.prog-badge.progress { background: var(--amber-light); color: var(--amber); }
.prog-badge.ready { background: var(--green-light); color: var(--green-dark); }
.prog-badge .advance-btn {
  margin-left: auto;
  padding: 3px 10px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 11px;
  font-family: var(--sans);
  cursor: pointer;
}

/* Rest reminder */
.rest-note {
  text-align: center;
  font-size: 12px;
  color: var(--text-hint);
  padding: 8px;
  margin-bottom: 4px;
}

/* Complete workout button */
.complete-btn {
  width: 100%;
  padding: 14px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 500;
  font-family: var(--sans);
  cursor: pointer;
  margin-top: 16px;
  transition: opacity 0.15s;
}
.complete-btn:active { opacity: 0.85; }

/* Done state */
.done-state {
  text-align: center;
  padding: 28px 16px;
  background: var(--green-light);
  border-radius: var(--radius);
  margin-bottom: 12px;
}
.done-check { font-size: 36px; margin-bottom: 8px; }
.done-title { font-family: var(--serif); font-size: 20px; color: var(--green-dark); margin-bottom: 4px; }
.done-sub { font-size: 13px; color: var(--green); }

/* Walk log */
.log-form {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.form-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; }
.form-group { flex: 1; }
.form-label { font-size: 11px; color: var(--text-hint); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
.form-input {
  width: 100%;
  padding: 9px 12px;
  font-size: 15px;
  font-family: var(--sans);
  background: var(--bg);
  border: 0.5px solid var(--border-strong);
  border-radius: var(--radius-sm);
  color: var(--text);
  outline: none;
}
.form-input:focus { border-color: var(--green-mid); }
.log-btn {
  padding: 10px 20px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--sans);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.log-btn:active { opacity: 0.85; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 16px; }
.stat-card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.stat-label { font-size: 11px; color: var(--text-hint); margin-bottom: 4px; }
.stat-value { font-family: var(--serif); font-size: 28px; color: var(--text); line-height: 1; }
.stat-unit { font-size: 13px; color: var(--text-secondary); font-family: var(--sans); }

/* Chart */
.chart-wrap {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.chart-title { font-size: 12px; color: var(--text-hint); margin-bottom: 10px; }
.chart-svg { width: 100%; overflow: visible; }

/* Walk history */
.walk-item {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border);
  gap: 10px;
}
.walk-icon {
  width: 34px; height: 34px;
  background: var(--blue-light);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.walk-info { flex: 1; }
.walk-dist { font-weight: 500; font-size: 14px; }
.walk-meta { font-size: 12px; color: var(--text-hint); }
.walk-pace { font-size: 13px; color: var(--text-secondary); text-align: right; }

/* Calendar */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-title { font-family: var(--serif); font-size: 18px; }
.cal-nav-btn {
  width: 32px; height: 32px;
  background: var(--bg-card);
  border: 0.5px solid var(--border-strong);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 12px; }
.cal-dow { text-align: center; font-size: 10px; color: var(--text-hint); padding: 4px 0; }
.cal-cell {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  border-radius: 6px;
  position: relative;
}
.cal-cell.today { font-weight: 500; box-shadow: inset 0 0 0 1.5px var(--border-strong); }
.cal-cell.workout-a { background: #C0DD97; color: var(--green-dark); font-weight: 500; }
.cal-cell.workout-b { background: #B5D4F4; color: #0C447C; font-weight: 500; }
.cal-cell.workout-c { background: #F4C0D1; color: #72243E; font-weight: 500; }
.cal-cell.has-walk::after {
  content: '';
  position: absolute;
  bottom: 2px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--blue-mid);
}
.cal-cell.workout-a.has-walk::after,
.cal-cell.workout-b.has-walk::after,
.cal-cell.workout-c.has-walk::after { background: rgba(0,0,0,0.3); }

.cal-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* Workout history */
.hist-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border);
}
.hist-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.hist-dot.a { background: var(--green-mid); }
.hist-dot.b { background: var(--blue-mid); }
.hist-dot.c { background: var(--pink); }
.hist-name { flex: 1; font-size: 14px; }
.hist-date { font-size: 12px; color: var(--text-hint); }

.empty { text-align: center; padding: 2rem; color: var(--text-hint); font-size: 14px; line-height: 1.6; }

/* Phase banner */
.phase-banner {
  background: var(--green-light);
  border: 0.5px solid rgba(59,109,17,0.2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 12px;
  color: var(--green-dark);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Motivational overlay */
.msg-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.msg-overlay.visible {
  opacity: 1;
  pointer-events: all;
}
.msg-overlay.spicy { background: rgba(90, 15, 35, 0.92); }
.msg-overlay.hype  { background: rgba(27, 60, 8, 0.92); }
.msg-card {
  position: relative;
  text-align: center;
  padding: 0 16px;
  max-width: 320px;
}
.msg-emoji { font-size: 44px; margin-bottom: 20px; display: block; }
.msg-text {
  font-family: var(--serif);
  font-size: 26px;
  line-height: 1.35;
  color: #fff;
  letter-spacing: -0.01em;
}
.msg-from {
  margin-top: 20px;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div class="msg-overlay" id="msg-overlay">
  <div class="msg-card">
    <span class="msg-emoji" id="msg-emoji"></span>
    <div class="msg-text" id="msg-text"></div>
    <div class="msg-from">— Jake</div>
  </div>
</div>
<div class="shell">
  <div class="header">
    <div class="header-row">
      <span class="app-title">Summer Fit</span>
      <span class="app-date" id="header-date"></span>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" id="nav-workout" onclick="setTab('workout')">
    <span class="nav-icon">💪</span>Workout
  </button>
  <button class="nav-item" id="nav-walk" onclick="setTab('walk')">
    <span class="nav-icon">🚶‍♀️</span>Walk / Run
  </button>
  <button class="nav-item" id="nav-calendar" onclick="setTab('calendar')">
    <span class="nav-icon">📅</span>Calendar
  </button>
  <button class="nav-item" id="nav-stats" onclick="setTab('stats')">
    <span class="nav-icon">📊</span>Stats
  </button>
</nav>

<script>

// ── Message pool ───────────────────────────────────────────────────────────

  { text: "You have no idea how bad I want you.", type: 'spicy', emoji: '😏' },
  { text: "I love you and I am very, very into you.", type: 'spicy', emoji: '❤️' },

  { text: "I can't wait to get my hands on you.", type: 'spicy', emoji: '🔥' },
  { text: "You're a Wildwood 10.", type: 'spicy', emoji: '💯' },
  { text: "I love your body.", type: 'spicy', emoji: '😍' },
  { text: "Send progress pics. 😈", type: 'spicy', emoji: '📸' },
  { text: "I bet you look amazing right now and I wish I was there.", type: 'spicy', emoji: '😏' },
  { text: "For the record, I find you extremely attractive.", type: 'spicy', emoji: '🔥' },
  { text: "Hot. Just... hot.", type: 'spicy', emoji: '🌶️' },
  { text: "I'm your husband and I endorse this body.", type: 'spicy', emoji: '✅' },

  { text: "I have very specific plans for that body.", type: 'spicy', emoji: '😏' },

  { text: "I love watching you be good at things.", type: 'hype', emoji: '🥹' },

// Pick a message that hasn't shown in the last 7 days
// Spicy messages show roughly 1 in 4 times
function pickMessage() {
  const shown = load('sf_shown_msgs', []);
  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const recentIds = shown.filter(e => e.ts > sevenDaysAgo).map(e => e.id);

  const useSpicy = Math.random() < 0.25;
  const pool = MESSAGES.filter((m, i) => !recentIds.includes(i) && (useSpicy ? m.type === 'spicy' : m.type === 'hype'));
  // fallback: if pool is empty (all shown recently), open it up
  const fallback = MESSAGES.filter((m, i) => useSpicy ? m.type === 'spicy' : m.type === 'hype');
  const candidates = pool.length > 0 ? pool : fallback;

  const msg = candidates[Math.floor(Math.random() * candidates.length)];
  const id = MESSAGES.indexOf(msg);

  // Record it
  shown.push({ id, ts: Date.now() });
  // Keep only last 60 entries
  if (shown.length > 60) shown.splice(0, shown.length - 60);
  save('sf_shown_msgs', shown);

  return msg;
}

let msgTimer = null;

function showMessage() {
  const msg = pickMessage();
  const overlay = document.getElementById('msg-overlay');
  document.getElementById('msg-emoji').textContent = msg.emoji;
  document.getElementById('msg-text').textContent = msg.text;
  overlay.className = 'msg-overlay ' + msg.type;

  // Fade in
  requestAnimationFrame(() => {
    overlay.classList.add('visible');
  });

  // Auto-dismiss after 4 seconds
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = setTimeout(() => {
    overlay.classList.remove('visible');
  }, 4000);

  // Tap to dismiss early
  overlay.onclick = () => {
    if (msgTimer) clearTimeout(msgTimer);
    overlay.classList.remove('visible');
  };
}

// ── State ──────────────────────────────────────────────────────────────────
function load(k, def) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}
function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
}

// Look at completed workout history and return which day to show on open.
// Rules:
//   1. Already completed a workout today → show that day
//   2. Last workout was ≤3 days ago → next in A→B→C→A rotation
//   3. No history or gap >3 days → default to A (fresh start)
function getNextDay() {
  const completed = load('sf_completed', {});
  const today = new Date().toISOString().slice(0,10);

  // Rule 1: already done today
  if (completed[today]) return completed[today];

  // Find the most recent completed entry
  const dates = Object.keys(completed).sort().reverse();
  if (dates.length === 0) return 'A';

  const lastDate = dates[0];
  const lastDay = completed[lastDate];

  // Rule 3: gap > 3 days → reset to A
  const daysDiff = Math.round((new Date(today) - new Date(lastDate)) / 86400000);
  if (daysDiff > 3) return 'A';

  // Rule 2: advance the rotation
  const rotation = { A: 'B', B: 'C', C: 'A' };
  return rotation[lastDay] || 'A';
}

let state = {
  tab: 'workout',
  activeDay: getNextDay(),
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear()
};

function getProgressions() { return load('sf_progressions', {}); }
function getCompleted() { return load('sf_completed', {}); }
function getTodayLog() { return load('sf_todaylog', {}); }
function getWalks() { return load('sf_walks', []); }

function todayKey() { return new Date().toISOString().slice(0,10); }

// ── Workout logic ──────────────────────────────────────────────────────────
function getLevel(exId) { return (getProgressions()[exId] || 0); }

function logKey() { return todayKey() + '_' + state.activeDay; }

function toggleSet(exId, setIdx) {
  const log = getTodayLog();
  const k = logKey();
  if (!log[k]) log[k] = {};
  if (!log[k][exId]) log[k][exId] = {};
  log[k][exId][setIdx] = !log[k][exId][setIdx];
  save('sf_todaylog', log);

  // Check progression completion
  const prog = getProgressions();
  const ex = Object.values(PROGRAM).flatMap(d => d.exercises).find(e => e.id === exId);
  if (!ex) { render(); return; }
  const level = getLevel(exId);
  const done = Object.values(log[k][exId] || {}).filter(Boolean).length;
  if (done >= ex.sets) {
    const ck = exId + '_l' + level;
    if (!prog[ck + '_t_' + todayKey()]) {
      prog[ck + '_t_' + todayKey()] = 1;
      prog[ck + '_n'] = (prog[ck + '_n'] || 0) + 1;
      save('sf_progressions', prog);
    }
    // Only fire message when checking the final set (not unchecking)
    if (log[k][exId][setIdx] === true) {
      showMessage();
    }
  }
  render();
}

function advanceLevel(exId) {
  const prog = getProgressions();
  const ex = Object.values(PROGRAM).flatMap(d => d.exercises).find(e => e.id === exId);
  if (!ex) return;
  const level = getLevel(exId);
  if (level < ex.progressions.length - 1) {
    prog[exId] = level + 1;
    save('sf_progressions', prog);
    render();
  }
}

function completeWorkout() {
  const completed = getCompleted();
  completed[todayKey()] = state.activeDay;
  save('sf_completed', completed);
  render();
}

function getProgStatus(exId) {
  const prog = getProgressions();
  const ex = Object.values(PROGRAM).flatMap(d => d.exercises).find(e => e.id === exId);
  if (!ex) return null;
  const level = getLevel(exId);
  if (level >= ex.progressions.length - 1) return null;
  const ck = exId + '_l' + level + '_n';
  const n = prog[ck] || 0;
  if (n === 0) return null;
  if (n >= 3) return { type: 'ready', n };
  return { type: 'progress', n };
}

// Phase detection: count total completed workouts to suggest week phase
function getPhase() {
  const completed = getCompleted();
  const total = Object.keys(completed).length;
  if (total < 6) return { label: 'Phase 1 — Form Focus', desc: 'Weeks 1–2: 2 rounds max, master form', rounds: 2 };
  if (total < 12) return { label: 'Phase 2 — Build Volume', desc: 'Weeks 3–4: 3 rounds, 60-sec rest', rounds: 3 };
  return { label: 'Phase 3 — Push Further', desc: 'Week 5+: 3 rounds, reduce rest to 45 sec', rounds: 3, note: '45-sec rest' };
}

// ── Walk logic ─────────────────────────────────────────────────────────────
function logWalk() {
  const distEl = document.getElementById('walk-dist');
  const durEl = document.getElementById('walk-dur');
  const dist = parseFloat(distEl.value);
  const dur = parseInt(durEl.value);
  if (!dist || dist <= 0) { distEl.focus(); return; }
  const walks = getWalks();
  walks.push({ date: todayKey(), dist: dist, dur: dur || null });
  save('sf_walks', walks);
  distEl.value = '';
  durEl.value = '';
  render();
}

function deleteWalk(idx) {
  const walks = getWalks();
  walks.splice(idx, 1);
  save('sf_walks', walks);
  render();
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const now = new Date();
  document.getElementById('header-date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  ['workout','walk','calendar','stats'].forEach(t => {
    document.getElementById('nav-' + t).classList.toggle('active', state.tab === t);
  });

  const content = document.getElementById('content');
  if (state.tab === 'workout') content.innerHTML = renderWorkout();
  else if (state.tab === 'walk') content.innerHTML = renderWalk();
  else if (state.tab === 'calendar') content.innerHTML = renderCalendar();
  else content.innerHTML = renderStats();
}

function renderWorkout() {
  const day = PROGRAM[state.activeDay];
  const completed = getCompleted();
  const doneToday = completed[todayKey()] === state.activeDay;
  const log = getTodayLog();
  const lk = logKey();
  const phase = getPhase();

  // Day tabs
  const suggestedDay = getNextDay();
  let h = `<div class="day-tabs">
    ${['A','B','C'].map(d => `
      <div class="day-tab ${state.activeDay===d?'active':''}" onclick="setDay('${d}')">
        <span class="tab-letter">${PROGRAM[d].name}</span>
        <span class="tab-sub">${PROGRAM[d].subtitle}</span>
        ${d === suggestedDay ? `<span class="up-next-pip">Today's workout!</span>` : ''}
      </div>`).join('')}
  </div>`;

  // Phase banner
  h += `<div class="phase-banner">🎯 <strong>${phase.label}</strong> — ${phase.desc}</div>`;

  // Done state
  if (doneToday) {
    h += `<div class="done-state">
      <div class="done-check">✓</div>
      <div class="done-title">${day.name} done!</div>
      <div class="done-sub">Great work, Genny. Rest and come back strong.</div>
    </div>`;
  }

  // Warm-up block
  h += `<div class="warmup-card">
    <div class="warmup-title">🔥 Warm-Up · 2 min</div>
    ${day.warmup.map(w => `
      <div class="warmup-item">
        <span>${w.name}</span>
        <span class="warmup-dur">${w.duration}</span>
      </div>`).join('')}
  </div>`;

  // Exercises
  day.exercises.forEach(ex => {
    const level = getLevel(ex.id);
    const prog = ex.progressions[level];
    const setLog = (log[lk] && log[lk][ex.id]) || {};
    const status = getProgStatus(ex.id);

    h += `<div class="ex-card">
      <div class="ex-header">
        <div class="ex-name">${prog.label}</div>
        <a class="ex-video" href="${prog.video}" target="_blank">▶ video</a>
      </div>
      <div class="ex-target">${ex.target}</div>
      <div class="ex-desc">${ex.desc}</div>
      <div class="sets-cols"><span>${ex.sets} sets</span><span>${prog.repLabel}</span><span>done</span></div>`;

    for (let i = 0; i < ex.sets; i++) {
      const done = !!setLog[i];
      h += `<div class="set-row">
        <span class="set-num">Set ${i+1}</span>
        <span class="set-reps">${prog.repLabel}</span>
        <div class="set-check ${done?'done':''}" onclick="toggleSet('${ex.id}',${i})">${done?'✓':''}</div>
      </div>`;
    }

    if (status) {
      if (status.type === 'ready') {
        h += `<div class="prog-badge ready">🎉 Ready to level up! <button class="advance-btn" onclick="advanceLevel('${ex.id}')">Advance →</button></div>`;
      } else {
        h += `<div class="prog-badge progress">⭐ ${status.n}/3 sessions at this level — keep going!</div>`;
      }
    }

    h += `</div>`;
  });

  // Rest reminder
  const restLabel = phase.note ? phase.note : `${day.restSeconds} sec`;
  h += `<div class="rest-note">Rest ${restLabel} between rounds</div>`;

  if (!doneToday) {
    h += `<button class="complete-btn" onclick="completeWorkout()">Complete ${day.name} ✓</button>`;
  }
  return h;
}

function renderWalk() {
  const walks = getWalks();
  const totalMiles = walks.reduce((s, w) => s + w.dist, 0);

  const weekStart = new Date();
  weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  const weekKey = weekStart.toISOString().slice(0,10);
  const weekMiles = walks.filter(w => w.date >= weekKey).reduce((s,w) => s + w.dist, 0);

  let h = `<div class="section-label">Log today's activity</div>
  <div class="log-form">
    <div class="form-row">

        <label class="form-label" for="walk-dist">Miles</label>
        <input class="form-input" id="walk-dist" type="number" step="0.1" min="0" placeholder="3.2">

        <input class="form-input" id="walk-dur" type="number" min="0" placeholder="52">

    h += `<div class="empty">No walks logged yet.<br>Log your first one above!</div>`;

      }
      h += `<div class="walk-item">
        <div class="walk-icon">🚶‍♀️</div>

          <div class="walk-dist">${w.dist.toFixed(1)} mi${w.dur ? ' · ' + w.dur + ' min' : ''}</div>
          <div class="walk-meta">${label}</div>
        </div>
        ${pace ? `<div class="walk-pace">${pace}</div>` : ''}
        <div style="cursor:pointer;color:var(--text-hint);font-size:18px;padding:4px 0 4px 8px" onclick="deleteWalk(${realIdx})">×</div>
      </div>`;
    });
  }

  return h;
}

function renderWalkChart(walks) {
  const weeks = [];
  const now = new Date();
  for (let i = 7; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - d.getDay() - i * 7);
    const start = d.toISOString().slice(0,10);
    const end = new Date(d.getTime() + 6 * 86400000).toISOString().slice(0,10);
    const miles = walks.filter(w => w.date >= start && w.date <= end).reduce((s,w)=>s+w.dist,0);
    const label = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    weeks.push({ label, miles });
  }

  const maxMiles = Math.max(...weeks.map(w => w.miles), 1);
  const W = 320, H = 100;
  const barW = Math.floor(W / weeks.length) - 4;
  const gap = (W - barW * weeks.length) / (weeks.length - 1);

  let bars = '';
  weeks.forEach((wk, i) => {
    const x = i * (barW + gap);
    const barH = wk.miles > 0 ? Math.max(4, Math.round((wk.miles / maxMiles) * (H - 24))) : 0;
    const y = H - 16 - barH;
    const isCurrentWeek = i === 7;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3"
      fill="${isCurrentWeek ? '#3B6D11' : '#C0DD97'}" />`;
    if (wk.miles > 0) {
      bars += `<text x="${x + barW/2}" y="${y - 3}" text-anchor="middle" font-size="9" fill="#5F5E5A">${wk.miles.toFixed(1)}</text>`;
    }
    if (i === 0 || i === 4 || i === 7) {
      bars += `<text x="${x + barW/2}" y="${H - 2}" text-anchor="middle" font-size="9" fill="#888780">${wk.label}</text>`;
    }
  });

  return `<div class="chart-wrap">
    <div class="chart-title">Weekly miles — last 8 weeks</div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" height="${H}">${bars}</svg>
  </div>`;
}

function renderCalendar() {
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dows = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const y = state.calYear, m = state.calMonth;
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = todayKey();
  const completed = getCompleted();
  const walks = getWalks();
  const walkDates = new Set(walks.map(w => w.date));

  let h = `<div class="cal-header">
    <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
    <span class="cal-title">${months[m]} ${y}</span>
    <button class="cal-nav-btn" onclick="calNav(1)">›</button>
  </div>
  <div class="cal-grid">
    ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}`;

  for (let i=0;i<firstDay;i++) h += `<div class="cal-cell"></div>`;

  for (let d=1;d<=daysInMonth;d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const workout = completed[ds];
    const hasWalk = walkDates.has(ds);
    const isToday = ds === todayStr;
    let cls = 'cal-cell';
    if (workout) cls += ' workout-' + workout.toLowerCase();
    if (hasWalk) cls += ' has-walk';
    if (isToday) cls += ' today';
    h += `<div class="${cls}">${d}</div>`;
  }

  h += `</div>
  <div class="cal-legend">
    <div class="legend-item"><div class="legend-dot" style="background:#C0DD97"></div>Lower Power</div>
    <div class="legend-item"><div class="legend-dot" style="background:#B5D4F4"></div>Upper Grit</div>
    <div class="legend-item"><div class="legend-dot" style="background:#F4C0D1"></div>Full Circuit</div>
    <div class="legend-item"><div class="legend-dot" style="background:#378ADD;border-radius:50%"></div>Walk/run</div>
  </div>`;

  const allEntries = [];
  Object.entries(completed).forEach(([date, day]) => allEntries.push({ date, type: 'workout', day }));
  walks.forEach(w => allEntries.push({ date: w.date, type: 'walk', dist: w.dist, dur: w.dur }));
  allEntries.sort((a,b) => b.date.localeCompare(a.date));

  h += `<div class="section-label">Activity log</div>`;
  if (allEntries.length === 0) {
    h += `<div class="empty">No activity logged yet.</div>`;
  } else {
    allEntries.slice(0,20).forEach(e => {
      const d = new Date(e.date + 'T12:00:00');
      const label = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      if (e.type === 'workout') {
        const prog = PROGRAM[e.day];
        h += `<div class="hist-item">
          <div class="hist-dot ${e.day.toLowerCase()}"></div>
          <div class="hist-name">Day ${e.day} — ${prog.name}</div>
          <div class="hist-date">${label}</div>
        </div>`;
      } else {
        h += `<div class="hist-item">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--blue-mid);flex-shrink:0"></div>
          <div class="hist-name">🚶‍♀️ ${e.dist.toFixed(1)} mi${e.dur?' · '+e.dur+' min':''}</div>
          <div class="hist-date">${label}</div>
        </div>`;
      }
    });
  }

  return h;
}

function renderStats() {
  const completed = getCompleted();
  const walks = getWalks();
  const entries = Object.entries(completed);
  const totalWorkouts = entries.length;
  const totalMiles = walks.reduce((s,w)=>s+w.dist,0);
  const counts = {A:0,B:0,C:0};
  entries.forEach(([,d])=>{ if(counts[d]!==undefined) counts[d]++; });

  // Workout streak
  let streak = 0;
  const today = new Date();
  for (let i=0;i<90;i++) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const k = d.toISOString().slice(0,10);
    if (completed[k]) streak++;
    else if (i > 0) break;
  }

  const avgMiles = walks.length > 0 ? (totalMiles / walks.length) : 0;
  const phase = getPhase();

  let h = `<div class="phase-banner">🎯 <strong>${phase.label}</strong> — ${phase.desc}</div>`;

  h += `<div class="section-label">Workouts</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total workouts</div><div class="stat-value">${totalWorkouts}</div></div>
    <div class="stat-card"><div class="stat-label">Workout streak</div><div class="stat-value">${streak}<span class="stat-unit"> 🔥</span></div></div>
    <div class="stat-card"><div class="stat-label">Lower Power (A)</div><div class="stat-value">${counts.A}</div></div>
    <div class="stat-card"><div class="stat-label">Upper Grit (B)</div><div class="stat-value">${counts.B}</div></div>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Full Circuit (C)</div><div class="stat-value">${counts.C}</div></div>
  </div>`;

  h += `<div class="section-label">Walking & running</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total miles</div><div class="stat-value">${totalMiles.toFixed(1)}<span class="stat-unit"> mi</span></div></div>
    <div class="stat-card"><div class="stat-label">Total sessions</div><div class="stat-value">${walks.length}</div></div>
    <div class="stat-card"><div class="stat-label">Avg distance</div><div class="stat-value">${avgMiles.toFixed(1)}<span class="stat-unit"> mi</span></div></div>
  </div>`;

  if (walks.length > 0) {
    h += `<div class="section-label">Miles over time</div>` + renderWalkChart(walks);
  }

  // Progression summary
  const prog = getProgressions();
  const allEx = Object.values(PROGRAM).flatMap(d => d.exercises);
  const advanced = allEx.filter(ex => (prog[ex.id] || 0) > 0);
  if (advanced.length > 0) {
    h += `<div class="section-label">Exercise progressions</div>`;
    advanced.forEach(ex => {
      const level = prog[ex.id] || 0;
      const current = ex.progressions[level];
      h += `<div class="hist-item">
        <div style="font-size:16px">⬆️</div>
        <div class="hist-name" style="font-size:13px">${ex.name}<br><span style="color:var(--text-hint);font-size:12px">Now: ${current.label} · ${current.repLabel}</span></div>
      </div>`;
    });
  }

  return h;
}

// ── Controls ───────────────────────────────────────────────────────────────
function setTab(t) { state.tab = t; render(); window.scrollTo(0,0); }
function setDay(d) { state.activeDay = d; render(); }
function calNav(dir) {
  state.calMonth += dir;
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  render();
}

render();
</script>
</body>
</html>
